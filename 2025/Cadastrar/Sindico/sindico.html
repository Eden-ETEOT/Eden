    <main id="section-main-form" class="main-content">

        <div class="form-container">

                <h2 class="form-title">Dados Pessoais</h2>

                <p class="form-subtitle">Preencha suas informações pessoais</p>

            <hr class="form-divider">

            <form class="personal-data-form">

                    <div class="form-group">

                        <label for="cpf">CPF*</label>

                        <input type="text" id="cpf" name="cpf" placeholder="111.222.333-44">

                    <div class="form-group">

                        <label for="email">E-mail*</label>

                        <input type="email" id="email" name="email" placeholder="dd/mm/yyyy">

                    <div class="form-group">

                        <label for="phone">Telefone*</label>

                        <input type="tel" id="phone" name="phone" placeholder="+55 (21) 91234-5678">

                    </div>

                    <div class="form-group">

                        <label for="password">Senha*</label>

                        <input type="password" id="password" name="password" placeholder="*****">

                    </div>

                    <div class="form-group">

                        <label for="confirmPassword">Confirmar senha*</label>

                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="*****">

                    </div>
