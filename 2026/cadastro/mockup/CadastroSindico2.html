<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cadastro Síndico 2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../CSS/CadastroSindico.css">
</head>
<body>
  <main class="panel-rigth">

    <form class="form" action="CadastroSindico3.html" method="post">

        <figure aria-label="Logo da empresa">
        <img src="../../assets/Logo.png" alt="Logo da empresa" class="logo-image">
      </figure>

      <header>
        <h1 class="title">Crie sua Conta</h1>
        <p class="subtitle">Insira suas Informações</p>
      </header>

      <section class="content">

        <div class="field">
          <label for="number">Telefone</label>
          <input
            type="number"
            id="telefone"
            name="telefone"
            required
          >
        </div>

        <div class="field">
          <label for="senha">Senha</label>
          <input
            type="password"
            id="senha"
            name="senha"
            required
          >
        </div>

        <div class="field">
          <label for="confirmar senha">Confirmar senha</label>
          <input
            type="password"
            id="confirmar senha"
            name="confirmar senha"
            required
          >
        </div>

      </section>

      <footer class="footer-form">

        <button type="submit">
          Próximo
        </button>

      </footer>

      <div class="divider" aria-hidden="true">
        <hr>
        <span>ou</span>
        <hr>
      </div>

      <p class="register">
        <a href="#">Já tem uma conta? <a href="../../Login/loginMockup/index.php">Faça seu login</a></a>
      </p>

    </form>

  </main>

  <aside class="panel-left" aria-label="Imagem ilustrativa"></aside>


</body>
</html>
