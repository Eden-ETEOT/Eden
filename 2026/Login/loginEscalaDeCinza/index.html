<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../CSS/Login.css">
  <link rel="stylesheet" href="../../css/root.css">
</head>
<body>

  <aside class="panel-left" aria-label="Imagem ilustrativa"></aside>

  <main class="panel-right">

    <form class="form">

      <figure class="logo" aria-label="Logo da empresa"></figure>

      <header>
        <h1 class="title">aaaaaaaaaa</h1>
        <p class="subtitle">xxxxxxxxxxxxxx</p>
      </header>

      <section class="content">

        <div class="field">
          <label for="usuario">Xxx</label>
          <input
            type="text"
            id="usuario"
            name="usuario"
            placeholder="a"
            required
          >
        </div>

        <div class="field">
          <label for="senha">Xxx</label>
          <input
            type="password"
            id="senha"
            name="senha"
            placeholder="a"
            required
          >
        </div>

      </section>

      <footer class="footer-form">

        <div class="row">
          <label>
            <input type="checkbox" name="lembrar">
            xxxxxxxxxxxxxxx
          </label>

          <a href="#">Esqueceu a senha?</a>
        </div>

        <button type="submit">
          button
        </button>

      </footer>

      <div class="divider" aria-hidden="true">
        <hr>
        <span>xx</span>
        <hr>
      </div>

      <p class="register">
        <a href="#">xxxxxxxxxxxxxxxxxxxxxx</a>
      </p>

    </form>

  </main>

</body>
</html>
