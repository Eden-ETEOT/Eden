<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paleta de Botões - Outline</title>
    <link rel="stylesheet" href="../css/variaveis.css">
    <link rel="stylesheet" href="../css/botoes.css">

</head>
<body>
    <div class="container">
        <h1>Paleta de Botões - Outline - Eden</h1>
        
        <div class="botoes-grid">
            <!-- Laranja 1 - Default -->
            <div class="grupo-botoes">
                <span class="label-grupo">Laranja 1</span>
                <div class="buttons-row">
                    <button class="btn btn-sm btn-outline-orange1-default">button</button>
                    <button class="btn btn-md btn-outline-orange1-default">button</button>
                    <button class="btn btn-lg btn-outline-orange1-default">button</button>
                </div>
            </div>

            <!-- Laranja 2 - Default -->
            <div class="grupo-botoes">
                <span class="label-grupo">Laranja 2</span>
                <div class="buttons-row">
                    <button class="btn btn-sm btn-outline-orange2-default">button</button>
                    <button class="btn btn-md btn-outline-orange2-default">button</button>
                    <button class="btn btn-lg btn-outline-orange2-default">button</button>
                </div>
            </div>

            <!-- Verde 1 - Default -->
            <div class="grupo-botoes">
                <span class="label-grupo">Verde 1</span>
                <div class="buttons-row">
                    <button class="btn btn-sm btn-outline-green1-default">button</button>
                    <button class="btn btn-md btn-outline-green1-default">button</button>
                    <button class="btn btn-lg btn-outline-green1-default">button</button>
                </div>
            </div>

            <!-- Verde 3 - Default (Success) -->
            <div class="grupo-botoes">
                <span class="label-grupo">Verde 3</span>
                <div class="buttons-row">
                    <button class="btn btn-sm btn-outline-green3-default">button</button>
                    <button class="btn btn-md btn-outline-green3-default">button</button>
                    <button class="btn btn-lg btn-outline-green3-default">button</button>
                </div>
            </div>

            <!-- Amarelo - Default -->
            <div class="grupo-botoes">
                <span class="label-grupo">Amarelo</span>
                <div class="buttons-row">
                    <button class="btn btn-sm btn-outline-yellow-default">button</button>
                    <button class="btn btn-md btn-outline-yellow-default">button</button>
                    <button class="btn btn-lg btn-outline-yellow-default">button</button>
                </div>
            </div>

            <!-- Vermelho - Default -->
            <div class="grupo-botoes">
                <span class="label-grupo">Vermelho</span>
                <div class="buttons-row">
                    <button class="btn btn-sm btn-outline-red-default">button</button>
                    <button class="btn btn-md btn-outline-red-default">button</button>
                    <button class="btn btn-lg btn-outline-red-default">button</button>
                </div>
            </div>

            <!-- Azul - Default -->
            <div class="grupo-botoes">
                <span class="label-grupo">Azul</span>
                <div class="buttons-row">
                    <button class="btn btn-sm btn-outline-blue-default">button</button>
                    <button class="btn btn-md btn-outline-blue-default">button</button>
                    <button class="btn btn-lg btn-outline-blue-default">button</button>
                </div>
            </div>

            <!-- Cinza - Default -->
            <div class="grupo-botoes">
                <span class="label-grupo">Cinza</span>
                <div class="buttons-row">
                    <button class="btn btn-sm btn-outline-gray-default">button</button>
                    <button class="btn btn-md btn-outline-gray-default">button</button>
                    <button class="btn btn-lg btn-outline-gray-default">button</button>
                </div>
            </div>

            <!-- Preto - Default -->
            <div class="grupo-botoes">
                <span class="label-grupo">Preto</span>
                <div class="buttons-row">
                    <button class="btn btn-sm btn-outline-black-default">button</button>
                    <button class="btn btn-md btn-outline-black-default">button</button>
                    <button class="btn btn-lg btn-outline-black-default">button</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
