<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/RedefinirSenhaWireframe.css">
</head>
<body>

    <aside class="panel-left"></aside>

    <main class="panel-right">

        <form class="form">

            <figure class="logo"></figure>

            <header>
                <h1 class="title">Criar nova senha</h1>

                <p class="subtitle">
                    Digite sua nova senha abaixo
                </p>
            </header>

            <section class="content">

                <div class="field">
                    <label for="nova-senha">
                        Nova senha
                    </label>

                    <input
                        type="password"
                        id="nova-senha"
                        name="nova-senha"
                        placeholder="Digite sua nova senha"
                        required
                    >
                </div>

                <div class="field">
                    <label for="confirmar-senha">
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        id="confirmar-senha"
                        name="confirmar-senha"
                        placeholder="Digite novamente a senha"
                        required
                    >
                </div>

            </section>

            <footer class="footer-form">

                <button type="submit">
                    Redefinir senha
                </button>

            </footer>

        </form>

    </main>

</body>
</html>
