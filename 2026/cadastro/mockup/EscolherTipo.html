<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tipo de Usuário Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../CSS/EscolherTipo.css">
</head>
<body>

  <aside class="panel-left" aria-label="Imagem ilustrativa"></aside>

  <main class="panel-right">

    <form class="form">

       <figure aria-label="Logo da empresa">
        <img src="../../assets/Logo.png" alt="Logo da empresa" class="logo-image">
      </figure>

      <header>
        <h1 class="title">Cadastre-se</h1>
        <p class="subtitle">Defina seu tipo de usuário para acessar a plataforma</p>
      </header>

      <section class="content">

        <div class="card-1 card-morador">
            <figure>
                <img src="../../assets/icones/usuario.png" alt="">
            </figure>
            <h1 class="titulo-card1">Morador</h1>
            <h3 class="subtitulo-card1">Registre ocorrências,
                acompanhe o status e receba atualizações em tempo real
            </h3>
            <img class="icon-arrow" src="../../assets/icones/arrow_right_alt.png" alt="">
        </div>

         <div class="card-1 card-sindico">
           <figure>
                <img src="../../assets/icones/sindico.png" alt="">
            </figure>
            <h1 class="titulo-card1">Sindico</h1>
            <h3 class="subtitulo-card1">Gestão completa do condominio na palma da sua mão</h3>

            <a href="CadastroSindico1.html">
            <img  class="icon-arrow" 
            src="../../assets/icones/arrow_right_alt.png" alt="">
            </a>
        </div>

      </section>

     

    </form>

  </main>

</body>
</html>
