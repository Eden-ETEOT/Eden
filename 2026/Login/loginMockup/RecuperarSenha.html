<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/2026/CSS/LoginMockup.css">
  <link rel="stylesheet" href="/2026/CSS/variaveis.css">
</head>
<body>

  <aside class="panel-left" aria-label="Imagem ilustrativa"></aside>

  <main class="panel-right">

    <form class="form">

      <figure aria-label="Logo da empresa">
        <img src="../../assets/logo.png" alt="Logo da empresa" class="logo-image">
      </figure>

      <header>
        <h1 class="title">Recuper senha</h1>
        <p class="subtitle">Digite seu e-mail para redefinir a senha.</p>
      </header>

      <section class="content">

        <div class="field">
          <label for="usuario">E-mail</label>
          <input
            type="email"
            id="usuario"
            name="usuario"
            placeholder="Digite seu e-mail"
            required
          >
        </div>

    
      </section>

      <footer class="footer-form">

      
        <button type="submit">
          Recuperar senha
        </button>

      </footer>

      <div class="divider" aria-hidden="true">
        <hr>
        <span>Ou</span>
        <hr>
      </div>

      <p class="register">
        <a href="#">Voltar para login</a>
      </p>

    </form>

  </main>

</body>
</html>
