<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../CSS/LoginMockup.css">
  <link rel="stylesheet" href="../../css/root.css">
</head>
<body>

  <figure class="panel-left">
    <img src="../../assets/imageLogin.png" alt="Ilustração de login" class="panel-left-image">
  </figure>

  <main class="panel-right">

    <form class="form">

      <figure aria-label="Logo da empresa">
        <img src="../../assets/logo.png" alt="Logo da empresa" class="logo-image">
      </figure>

      <header>
        <h1 class="title">Bem-vindo de volta</h1>
        <p class="subtitle">Acesse sua conta para continuar</p>
      </header>

      <section class="content">

        <div class="field">
          <label for="usuario">E-mail</label>
          <input
            type="email"
            id="usuario"
            name="usuario"
            placeholder="Digite seu e-mail"
            required
          >
        </div>

        <div class="field">
          <label for="senha">Senha</label>
          <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Digite sua senha"
            required
          >
        </div>

      </section>

      <footer class="footer-form">

        <div class="row">
          <label>
            <input type="checkbox" name="lembrar">
            Lembrar senha
          </label>

          <a href="#">Esqueceu a senha?</a>
        </div>

        <button type="submit" class="btn-primary-orange-small">
          entrar
        </button>

      </footer>

      <div class="divider" aria-hidden="true">
        <hr>
        <span>ou</span>
        <hr>
      </div>

      <p class="register">
        <span>Não tem uma conta? <a href="#">Crie agora</a></span>
      </p>

    </form>

  </main>

</body>
</html>
