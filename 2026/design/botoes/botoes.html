<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paleta de Botões</title>
    <link rel="stylesheet" href="../css/variaveis.css">
    <link rel="stylesheet" href="../css/botoes.css">
</head>
<body>
    <div class="container">
        <h1>Paleta de Botões - Eden</h1>
        
        <div class="botoes-grid">
            <!-- Laranja 1 - Tons claros -->
            <div class="grupo-botoes">
                <span class="label-grupo">Laranja 1 - Claro</span>
                    <div class="buttons-row">
                    <button class="btn btn-sm btn-orange1-default">button</button>
                    <button class="btn btn-md btn-orange1-default">button</button>
                    <button class="btn btn-lg btn-orange1-default">button</button>
                </div>
            </div>

            <!-- Laranja 2 - Tons médios -->
            <div class="grupo-botoes">
                <span class="label-grupo">Laranja 2 - Médio</span>
                <div class="buttons-row">
                    <button class="btn btn-sm btn-orange2-800">button</button>
                    <button class="btn btn-md btn-orange2-800">button</button>
                    <button class="btn btn-lg btn-orange2-800">button</button>
                </div>
            </div>

            <!-- Verde 1 - Tons claros -->
            <div class="grupo-botoes">
                <span class="label-grupo">Verde 1 - Claro</span>
                <div class="buttons-row">
                    <button class="btn btn-sm btn-green1-default">button</button>
                    <button class="btn btn-md btn-green1-default">button</button>
                    <button class="btn btn-lg btn-green1-default">button</button>
                </div>
            </div>

            <!-- Verde 3 - Tons médios (Success) -->
            <div class="grupo-botoes">
                <span class="label-grupo">Verde 3 - Médio</span>
                <div class="buttons-row">
                    <button class="btn btn-sm btn-green3-800">button</button>
                    <button class="btn btn-md btn-green3-800">button</button>
                    <button class="btn btn-lg btn-green3-800">button</button>
                </div>

            </div>

            <!-- Amarelo -->
            <div class="grupo-botoes">
                <span class="label-grupo">Amarelo</span>
                <div class="buttons-row">
                    <button class="btn btn-sm btn-yellow-default">button</button>
                    <button class="btn btn-md btn-yellow-default">button</button>
                    <button class="btn btn-lg btn-yellow-default">button</button>
                </div>
            </div>

            <!-- Vermelho - Tons médios -->
            <div class="grupo-botoes">
                <span class="label-grupo">Vermelho - Médio</span>
                <div class="buttons-row">
                    <button class="btn btn-sm btn-red-default">button</button>
                    <button class="btn btn-md btn-red-default">button</button>
                    <button class="btn btn-lg btn-red-default">button</button>
                </div>
            </div>

            <!-- Azul - Tons médios -->
            <div class="grupo-botoes">
                <span class="label-grupo">Azul - Médio</span>
                <div class="buttons-row">
                    <button class="btn btn-sm btn-blue-default">button</button>
                    <button class="btn btn-md btn-blue-default">button</button>
                    <button class="btn btn-lg btn-blue-default">button</button>
                </div>
            </div>

            <!-- Preto - Tons escuros -->
            <div class="grupo-botoes">
                <span class="label-grupo">Preto - Escuro</span>
                <div class="buttons-row">
                    <button class="btn btn-sm btn-black-900">button</button>
                    <button class="btn btn-md btn-black-900">button</button>
                    <button class="btn btn-lg btn-black-900">button</button>
                </div>
                <div class="buttons-row">
                    <button class="btn btn-sm btn-black-800">button</button>
                    <button class="btn btn-md btn-black-800">button</button>
                    <button class="btn btn-lg btn-black-800">button</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
