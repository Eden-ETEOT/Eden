<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eden - Dados do condomínio</title>
    <link rel="stylesheet" href="css2/style2.css">
</head>
<body>
    <section id="section-header">

  <header class="site-header">

    <div class="header-container">

      <a href="#" class="logo">

        <img src="../Cadastrar/assents/path1590 2.svg" alt="EDEN Logo" class="logo-image">

        <span class="logo-text">EDEN</span>

      </a>

      <p class="header-title">Cadastro como Síndico</p>

      <a href="../../login/login.php" class="btn-login">Login</a>

    </div>

  </header>

</section>

<section id="section-form">

  <main class="main-content">

    <div class="form-container">

      <h1 class="form-main-title">Dados do Condomínio</h1>

      <p class="form-subtitle">Informe os dados do seu condomínio</p>

      <hr class="separator" />

      <form class="condo-form">

        <div class="form-grid">

          <div class="form-group full-width">

            <label for="condo-name">Nome do Condomínio</label>

            <input type="text" id="condo-name" placeholder="Condomínio residencial Bom Lar LTDA">

          </div>

          <div class="form-group">

            <label for="cnpj">CNPJ*</label>

            <input type="text" id="cnpj" placeholder="12.345.678/0001-00">

          </div>

          <div class="form-group">

            <label for="apartments">Número de Apartamentos*</label>

            <input type="text" id="apartments" placeholder="100">

          </div>

          <div class="form-group full-width">

            <label for="address">Endereço Completo*</label>

            <input type="text" id="address" placeholder="Rua Itapipoca Da Serra, 1221">

          </div>

          <div class="form-group">

            <label for="city">Cidade*</label>

            <input type="text" id="city" placeholder="Rio De Janeiro">

          </div>

          <div class="form-group">

            <label for="state">Estado*</label>

            <div class="select-wrapper form-group">

              <select id="state">

                <option selected disabled>Selecione...</option>

                <option value="RJ">Rio de Janeiro</option>

                <option value="SP">São Paulo</option>

              </select>

              <img src="../Cadastrar/assents/Vector.svg" alt="Select arrow" class="select-arrow">

            </div>

          </div>

          <div class="form-group">

            <label for="cep">CEP*</label>

            <input type="text" id="cep" placeholder="123456-78">

          </div>

          <div class="form-group">

            <label for="display-name">Nome de Exibição*</label>

            <input type="text" id="display-name" placeholder="Bom Lar">

          </div>

        </div>

        <div class="form-actions">

          <a href="sindico.html"><button type="button" class="btn btn-secondary">Voltar</button></a>

          <a href="EscolherPlano.html" class="btn btn-primary">Continuar</a>

        </div>

      </form>

    </div>

  </main>

</section>
</body>
</html>
