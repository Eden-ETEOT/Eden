<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eden - Confirmar E-mail</title>
    <link rel="stylesheet" href="css2/style2.css">
</head>
<body>
    <section id="section-header">

  <header class="site-header">

    <div class="header-container">

      <a href="#" class="logo" aria-label="Página inicial da EDEN">

        <img src="../Cadastrar/assents/path1590 2.svg" alt="EDEN Logo Icon" class="logo-icon">

        <span class="logo-text">EDEN</span>

      </a>

      <nav class="main-nav">

        <a href="#" class="nav-link">Entrar como Morador</a>

      </nav>

      <a href="../../login/login.php" class="btn-login">Login</a>

    </div>

  </header>

</section>

<section id="section-main">

  <main class="main-content">

    <div class="confirmation-card">

      <form>

        <h1 class="card-title">Confirmar E-Mail</h1>

        <p class="card-subtitle">Digite o E-mail e senha fornecidos pelo síndico</p>

        

        <div class="notification-bar">

          <span>✅ Código enviado para <span class="user-email">usuario@email.com</span></span>

        </div>

        

        <div class="code-inputs" role="group" aria-label="Campo de inserção de código de 6 dígitos">

          <input type="text" maxlength="1" class="code-input" aria-label="Primeiro dígito do código" pattern="[0-9]*" inputmode="numeric">

          <input type="text" maxlength="1" class="code-input" aria-label="Segundo dígito do código" pattern="[0-9]*" inputmode="numeric">

          <input type="text" maxlength="1" class="code-input" aria-label="Terceiro dígito do código" pattern="[0-9]*" inputmode="numeric">

          <input type="text" maxlength="1" class="code-input" aria-label="Quarto dígito do código" pattern="[0-9]*" inputmode="numeric">

          <input type="text" maxlength="1" class="code-input" aria-label="Quinto dígito do código" pattern="[0-9]*" inputmode="numeric">

          <input type="text" maxlength="1" class="code-input" aria-label="Sexto dígito do código" pattern="[0-9]*" inputmode="numeric">

        </div>

        

        <button type="button" class="btn btn-resend">Reenviar Código</button>

        

        <hr class="divider">

        

        <div class="form-actions">

          <a href="Morador.html"><button type="button" class="btn btn-back">Voltar</button></a>

          <button type="submit" class="btn btn-continue">Continuar</button>

        </div>

      </form>

    </div>

  </main>

</section>
</body>
</html>
